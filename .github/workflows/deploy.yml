name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/*.pdf', '**/*.docx']
  workflow_dispatch:

jobs:
  check:
    name: Check compose file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        working-directory: labs/lab3
        run: |
          cp .env.example .env
          docker compose config --quiet

  deploy:
    name: Deploy to server
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          script: |
            # Создаем папку на сервере, если ее нет
            mkdir -p /opt/myproject
            cd /opt/myproject
            
            # Очищаем старые файлы (если это первый запуск, ничего не удалит)
            rm -rf * .[!.]* || true
            
            # Клонируем код с GitHub
            git clone https://github.com/${{ github.repository }}.git .
            cd labs/lab3
            
            # Запускаем
            sudo docker compose down
            sudo docker compose up -d --build