name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/*.pdf', '**/*.docx']
  workflow_dispatch:

jobs:
  check:
    name: Check compose file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        working-directory: labs/lab3
        run: |
          docker compose --env-file .env.ci config --quiet

  build:
    name: Build images
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build docker images
        working-directory: labs/lab3
        run: |
          docker compose --env-file .env.ci build --pull

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          script: |
            cd /opt/myproject
            git fetch origin
            git reset --hard origin/main
            cd labs/lab3
            docker compose up -d --remove-orphans
            sleep 10

  healthcheck:
    name: Health check
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Check all services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          script: |
            cd /opt/myproject/labs/lab3
            chmod +x scripts/healthcheck.sh
            ./scripts/healthcheck.sh