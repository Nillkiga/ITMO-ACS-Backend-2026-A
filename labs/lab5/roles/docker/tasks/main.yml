---
# Docker role - установка Docker и Docker Compose

- name: Remove old Docker versions
  apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
  tags: docker

- name: Install Docker dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
  tags: docker

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  tags: docker

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  tags: docker

- name: Install Docker packages
  apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: yes
  tags: docker

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
  tags: docker

- name: Add users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  tags: docker

- name: Configure Docker daemon
  copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker
  tags: docker

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false
  tags: docker

- name: Verify Docker Compose installation
  command: docker compose version
  register: docker_compose_version
  changed_when: false
  tags: docker

- name: Test Docker with hello-world
  docker_container:
    name: hello-world-test
    image: hello-world
    state: started
    detach: false
    cleanup: true
  register: docker_test
  tags: [docker, never, test]

- name: Display Docker setup info
  debug:
    msg: |
      Docker setup completed:
      - Docker version: {{ docker_version.stdout }}
      - Docker Compose version: {{ docker_compose_version.stdout }}
      - Docker users: {{ docker_users | join(', ') }}
  tags: docker
