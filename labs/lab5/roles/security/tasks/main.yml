---
# Security role - UFW, SSH hardening, Fail2ban

- name: Install security packages
  apt:
    name:
      - ufw
      - fail2ban
    state: present
  tags: security

# === SSH Hardening ===
- name: Backup original sshd_config
  copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.backup
    remote_src: yes
    force: no
  tags: [security, ssh]

- name: Configure SSH security settings
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  loop:
    - { regexp: '^#?Port ', line: 'Port {{ ssh_port }}' }
    - { regexp: '^#?PermitRootLogin ', line: 'PermitRootLogin {{ ssh_permit_root_login }}' }
    - { regexp: '^#?PasswordAuthentication ', line: 'PasswordAuthentication {{ ssh_password_authentication }}' }
    - { regexp: '^#?PubkeyAuthentication ', line: 'PubkeyAuthentication {{ ssh_pubkey_authentication }}' }
    - { regexp: '^#?MaxAuthTries ', line: 'MaxAuthTries {{ ssh_max_auth_tries }}' }
    - { regexp: '^#?X11Forwarding ', line: 'X11Forwarding no' }
    - { regexp: '^#?PermitEmptyPasswords ', line: 'PermitEmptyPasswords no' }
  notify: Restart SSH
  tags: [security, ssh]

# === UFW Firewall ===
- name: Reset UFW to default
  ufw:
    state: reset
  tags: [security, firewall, never]

- name: Set UFW default policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
  tags: [security, firewall]

- name: Configure UFW rules
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ ufw_rules }}"
  tags: [security, firewall]

- name: Enable UFW
  ufw:
    state: enabled
  tags: [security, firewall]

# === Fail2ban ===
- name: Create Fail2ban local jail configuration
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  notify: Restart Fail2ban
  when: fail2ban_enabled
  tags: [security, fail2ban]

- name: Enable and start Fail2ban
  systemd:
    name: fail2ban
    state: started
    enabled: yes
  when: fail2ban_enabled
  tags: [security, fail2ban]

# === Security audit ===
- name: Check for world-writable files in /etc
  shell: find /etc -type f -perm -002 2>/dev/null || true
  register: world_writable
  changed_when: false
  tags: [security, audit, never]

- name: Display security setup info
  debug:
    msg: |
      Security setup completed:
      - SSH port: {{ ssh_port }}
      - Root login: {{ ssh_permit_root_login }}
      - UFW: Enabled with {{ ufw_rules | length }} rules
      - Fail2ban: {{ 'Enabled' if fail2ban_enabled else 'Disabled' }}
  tags: security
