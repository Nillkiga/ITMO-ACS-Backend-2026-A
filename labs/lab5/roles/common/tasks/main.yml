---
# Common role - базовая настройка системы

- name: Set timezone
  timezone:
    name: "{{ timezone }}"
  tags: timezone

- name: Set locale
  locale_gen:
    name: "{{ locale }}"
    state: present
  tags: locale

- name: Update all packages
  apt:
    upgrade: dist
    update_cache: yes
    autoremove: yes
    autoclean: yes
  register: apt_upgrade
  tags: update

- name: Check if reboot is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  tags: update

- name: Set reboot fact
  set_fact:
    reboot_required: "{{ reboot_required_file.stat.exists }}"
  tags: update

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: yes
  tags: packages

- name: Install Python pip packages
  pip:
    name: "{{ pip_packages }}"
    state: present
  tags: packages

- name: Create application group
  group:
    name: "{{ app_group }}"
    state: present
  tags: users

- name: Ensure application user exists
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    groups: sudo,docker
    append: yes
    shell: /bin/bash
    state: present
  tags: users

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  tags: directories

- name: Set hostname
  hostname:
    name: "{{ server_hostname }}"
  when: server_hostname is defined
  tags: hostname

- name: Update /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ server_hostname }}"
    state: present
  when: server_hostname is defined
  tags: hostname

- name: Configure sysctl for better performance
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'vm.swappiness', value: '10' }
    - { name: 'net.ipv4.tcp_keepalive_time', value: '600' }
    - { name: 'net.core.somaxconn', value: '1024' }
    - { name: 'fs.file-max', value: '2097152' }
  tags: sysctl

- name: Display common setup info
  debug:
    msg: |
      Common setup completed:
      - Timezone: {{ timezone }}
      - Locale: {{ locale }}
      - App user: {{ app_user }}
      - App dir: {{ app_dir }}
      - System updated: {{ apt_upgrade.changed }}
  tags: always
