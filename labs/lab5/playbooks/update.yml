---
# Update only playbook - только обновление пакетов

- name: Update packages on all hosts
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Display reboot status
      debug:
        msg: "Reboot {{ 'IS' if reboot_required_file.stat.exists else 'NOT' }} required"

    - name: Reboot if needed
      reboot:
        msg: "Reboot after system updates"
        reboot_timeout: 600
      when: reboot_required_file.stat.exists
      tags: [never, reboot]
