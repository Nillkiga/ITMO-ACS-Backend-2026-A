# Ansible inventory file
# Описание целевых серверов

all:
  children:
    production:
      hosts:
        app-server:
          ansible_host: 192.168.31.41  # ЗАМЕНИ на IP твоего сервера
          ansible_port: 22           # SSH порт (2222 из ЛР4, стандартный 22)
          ansible_user: allah         # SSH пользователь
          ansible_python_interpreter: /usr/bin/python3
          
          # Дополнительные параметры хоста
          server_hostname: restaurant-booking-server
          public_ip: 82.179.250.71     # Внешний IP (для nginx)

  vars:
    # Общие переменные для всех хостов
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
