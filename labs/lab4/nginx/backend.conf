# /etc/nginx/sites-available/my.conf
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 10m;

    # Весь API и всё остальное - через gateway
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger каждого сервиса (на /docs самого сервиса; gateway их не проксирует)
    location = /auth/docs { return 301 /auth/docs/; }
    location /auth/docs/ {
        proxy_pass http://127.0.0.1:8011/docs/;
        proxy_set_header Host $host;
    }
    location = /restaurant/docs { return 301 /restaurant/docs/; }
    location /restaurant/docs/ {
        proxy_pass http://127.0.0.1:8012/docs/;
        proxy_set_header Host $host;
    }
    location = /reservation/docs { return 301 /reservation/docs/; }
    location /reservation/docs/ {
        proxy_pass http://127.0.0.1:8013/docs/;
        proxy_set_header Host $host;
    }
    location = /review/docs { return 301 /review/docs/; }
    location /review/docs/ {
        proxy_pass http://127.0.0.1:8014/docs/;
        proxy_set_header Host $host;
    }
}
